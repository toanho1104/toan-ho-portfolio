server {
    listen 80;
    server_name api.toanhodev.com;

    include /etc/nginx/conf.d/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.toanhodev.com;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    location / {
        include /etc/nginx/conf.d/snippets/resolver.conf;
        set $upstream_api api;
        proxy_pass http://$upstream_api:3001;
        include /etc/nginx/conf.d/snippets/proxy.conf;
    }
}
