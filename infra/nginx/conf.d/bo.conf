server {
    listen 80;
    server_name bo.toanhodev.com;

    include /etc/nginx/conf.d/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bo.toanhodev.com;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    location / {
        proxy_pass http://bo:3002;
        include /etc/nginx/conf.d/snippets/proxy-bo.conf;
    }
}
