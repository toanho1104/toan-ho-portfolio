services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portfolio

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-unknown}
    container_name: portfolio-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    expose:
      - '3001'
    networks:
      - portfolio

  bo:
    build:
      context: .
      dockerfile: apps/bo/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        DEPLOY_SHA: ${DEPLOY_SHA:-unknown}
    container_name: portfolio-bo
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3002
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3002/login || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - '3002'
    networks:
      - portfolio

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        DEPLOY_SHA: ${DEPLOY_SHA:-unknown}
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - '3000'
    networks:
      - portfolio

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      bo:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - portfolio

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  postgres_data:
  certbot-webroot:
  certbot-certs:

networks:
  portfolio:
    driver: bridge
