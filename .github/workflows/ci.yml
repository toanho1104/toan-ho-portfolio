name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Build
        run: pnpm build

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d /home/runner/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key
          if ssh-keygen -y -f /home/runner/.ssh/deploy_key > /dev/null 2>&1; then
            echo "SSH key OK (raw private key)"
            exit 0
          fi
          echo "$EC2_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key
          if ssh-keygen -y -f /home/runner/.ssh/deploy_key > /dev/null 2>&1; then
            echo "SSH key OK (base64)"
            exit 0
          fi
          echo "::error::EC2_SSH_KEY invalid. Paste full private key (BEGIN...END) or base64."
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/deploy_key
          script: |
            cd /opt/portfolio
            git pull origin dev
            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"
            $COMPOSE up -d --build --wait || {
              $COMPOSE up -d --build
              echo "Waiting for services to become healthy..."
              for i in $(seq 1 90); do
                $COMPOSE ps api | grep -q "(healthy)" || { sleep 2; continue; }
                $COMPOSE ps bo | grep -q "(healthy)" || { sleep 2; continue; }
                $COMPOSE ps web | grep -q "(healthy)" || { sleep 2; continue; }
                break
              done
            }
            $COMPOSE restart nginx
            echo "=== Container status ==="
            $COMPOSE ps
            echo "=== Smoke test ==="
            curl -sf https://api.toanhodev.com/health || {
              echo "=== API logs ==="
              $COMPOSE logs api --tail 80
              echo "=== BO logs ==="
              $COMPOSE logs bo --tail 40
              echo "=== Web logs ==="
              $COMPOSE logs web --tail 40
              echo "=== Nginx logs ==="
              $COMPOSE logs nginx --tail 30
              exit 1
            }
            echo "Deploy OK"
